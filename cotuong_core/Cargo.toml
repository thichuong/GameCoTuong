[package]
name = "cotuong_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
serde-big-array = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Performance", "Window", "WorkerGlobalScope", "console"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
